

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Styled Form</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
  
  <div class="form-container">
    <h2>Registration Form</h2>
    <form id="userForm">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" placeholder="Enter your name" id="name" name="name" />
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="text" placeholder="Enter your email" id="email" name="email" />
      </div>

      <div class="form-group">
        <label for="mobile">Mobile No:</label>
        <input type="number" placeholder="Enter your mobile number" id="mobile" name="mobile"  />
      </div>

    <option value="Female">Female</option>

<div class="form-group" id="form-group-id">
  <label for="gender">Gender:</label><br>

  
  <label for="gender-male">Male</label><br>
  <input type="radio" id="gender-male" name="gender-radio" value="Male"/>


  <label for="gender-female">Female</label><br>
  <input type="radio" id="gender-female" name="gender-radio" value="Female"/>  

  <label for="gender-other">Other</label><br>
  <input type="radio" id="gender-other" name="gender-radio" value="Other"/>

  <input type="hidden" id="gender" name="gender" />
</div>

     

      <div class="form-group">
        <label for="file">Upload File:</label>
        <input type="file" id="file" name="file" accept=".csv" />
      </div>

      <div class="form-group">
        <label for="img">Upload Image:</label>
        <input type="file" id="img" name="img" accept="image/png,image/jpeg" />
      </div>

      <input type="submit" id="submit" value="Submit" />
    </form>
    
    <div id="loader" style="display: none;">
  <div class="spinner"></div>
</div>

 
</div>

  </div>
  <script src="script.js">
    
  </script>
</body>
</html>
